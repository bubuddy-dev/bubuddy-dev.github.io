<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground — bubuddy</title>
  <meta name="description" content="직접 만든 미니게임 모음.">
  <link rel="icon" href="/assets/games/pocket-roo-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header wrap">
    <nav class="nav">
      <a class="nav-home" href="/">bubuddy</a>
      <div class="nav-links">
        <a href="/" aria-current="page">Playground</a>
      </div>
    </nav>

  <main class="wrap">

    <!-- 새 게임은 li 하나를 복사해서 추가합니다 -->

      <li>
        <a class="tile" href="/games/corner-badminton/" title="화면 구석에 띄워두는 작은 배드민턴 체육관 🏸">

      </li>
      <li>
        <a class="tile" href="/games/pocket-roo/" title="화면 구석에 띄워두는 작은 캥거루 복싱 링 🥊">
          <img src="/assets/games/pocket-roo-icon.png" alt="">
          <span>Pocket Roo</span>
        </a>
      </li>
    </ul>
  </main>

  <footer class="site-footer wrap">© 2026 bubuddy</footer>
